<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode Finder</title>
  <style>
    :root { color-scheme: light dark; --accent: #2b6cb0; --muted: #6b7280; --line: rgba(128, 128, 128, 0.3); --surface: rgba(128, 128, 128, 0.08); --star: #f5b301; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    img { max-width: 100%; }

    /* Series header: backdrop, poster, title, facts, rating, summary */
    .hero { position: relative; overflow: hidden; margin: 8px 0 20px; border-radius: 12px; background: #1f2937; color: #f9fafb; }
    .hero .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.85) 45%, rgba(15, 23, 42, 0.55) 100%); }
    .hero-inner { position: relative; z-index: 1; display: flex; gap: 24px; padding: 24px; }
    .hero .poster, .hero .noposter { flex: none; width: 180px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; background: rgba(255, 255, 255, 0.1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .hero-text { min-width: 0; flex: 1; }
    .hero h2 { margin: 0; font-size: 1.9rem; line-height: 1.2; }
    .hero h2 .years { font-weight: 400; color: #cbd5e1; }
    .hero .facts { margin: 6px 0 12px; color: #cbd5e1; font-size: 0.95rem; }
    .rating { display: inline-flex; align-items: baseline; gap: 4px; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); font-weight: 600; }
    .rating .star { color: var(--star); }
    .rating .scale { font-weight: 400; color: #cbd5e1; font-size: 0.85rem; }
    .summary { margin: 0; }
    .summary.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .link-button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.9em; text-decoration: underline; }
    .hero .link-button { color: #93c5fd; }
    .hero .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 0.9rem; }
    .hero .links a { color: #93c5fd; }
    .info { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 24px; margin: 0 0 24px; padding: 16px; border-radius: 12px; background: var(--surface); }
    .info dt { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .info dd { margin: 0; }
    @media (max-width: 600px) {
      .hero-inner { flex-direction: column; padding: 16px; gap: 16px; }
      .hero .poster, .hero .noposter { width: 120px; }
      .show-head .hint { display: none; }
      .hero h2 { font-size: 1.5rem; }
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .lead { margin: 0 0 20px; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input[type="search"] { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
    button { font: inherit; cursor: pointer; }
    form button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
    #status { min-height: 1.5em; margin: 16px 0; color: var(--muted); }
    #status.error { color: #c53030; }
    .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .result { display: flex; gap: 12px; width: 100%; padding: 8px; text-align: left; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; }
    .result:hover, .result:focus-visible { border-color: var(--accent); }
    .result img, .result .noimg { width: 48px; height: 68px; flex: none; object-fit: cover; border-radius: 4px; background: var(--line); }
    .result .name { font-weight: 600; }
    .result .meta { color: var(--muted); font-size: 0.9rem; }
    .show-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .show-head h2 { margin: 0; font-size: 1.3rem; }
    .show-head .hint { color: var(--muted); font-size: 0.85rem; }
    .season-strip { display: flex; gap: 14px; overflow-x: auto; list-style: none; margin: 0 0 16px; padding: 8px 8px 12px; scroll-snap-type: x proximity; }
    .season-strip li { flex: none; scroll-snap-align: start; }
    .season-card { width: 128px; padding: 0; text-align: left; color: inherit; background: none; border: 0; }
    .season-card .thumb { position: relative; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 8px; background: var(--surface); outline: 3px solid transparent; outline-offset: 3px; transition: outline-color 0.15s; }
    .season-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .season-card .thumb.fallback img { filter: brightness(0.4) saturate(0.6); }
    .season-card .label { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 1.6rem; font-weight: 700; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
    .season-card:hover .thumb { outline-color: var(--line); }
    .season-card[aria-pressed="true"] .thumb { outline-color: var(--accent); }
    .season-card:focus-visible { outline: none; }
    .season-card:focus-visible .thumb { outline-color: var(--accent); outline-style: dashed; }
    .season-card .name { margin-top: 8px; font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
    .season-card .meta { color: var(--muted); font-size: 0.85rem; }
    .season-card.upcoming .thumb { opacity: 0.55; }
    .season-panel { padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
    .season-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .season-title { text-align: center; }
    .season-title h3 { margin: 0; font-size: 1.2rem; }
    .season-title .meta { color: var(--muted); font-size: 0.9rem; }
    .step { flex: none; padding: 6px 12px; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; }
    .step:hover:not(:disabled) { border-color: var(--accent); }
    .step.placeholder { visibility: hidden; }
    .season-summary { margin: 12px 0 0; color: var(--muted); }
    .empty { margin: 16px 0 0; color: var(--muted); }
    ol.episodes { list-style: none; margin: 12px 0 0; padding: 0; }
    ol.episodes li { padding: 8px 0; border-top: 1px solid var(--line); }
    .ep-toolbar { display: flex; justify-content: flex-end; margin-top: 16px; }
    ol.episodes li.episode { display: flex; gap: 16px; padding: 14px 0; }
    .still { flex: none; display: grid; place-items: center; width: 200px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: var(--surface); color: var(--muted); font-weight: 600; }
    .still img { width: 100%; height: 100%; object-fit: cover; }
    .ep-body { min-width: 0; flex: 1; }
    .ep-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .ep-num { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .ep-name { font-weight: 600; }
    .badge { padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.75rem; font-weight: 600; }
    .ep-meta { margin-top: 2px; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .ep-rating .star { color: var(--star); }
    .ep-summary { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .ep-summary.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 600px) {
      .still { width: 120px; }
      .season-panel { padding: 12px; }
      ol.episodes li.episode { gap: 12px; }
    }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
    footer a, .lead a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Episode Finder</h1>
  <p class="lead">Search any TV series and see every episode that has aired.</p>

  <form id="search-form">
    <input id="query" type="search" placeholder="e.g. The Big Bang Theory" aria-label="TV series name" autocomplete="off" required>
    <button type="submit">Search</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <ul id="results" class="results"></ul>
  <section id="show" hidden></section>

  <footer>
    Data from <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVmaze.com</a>,
    licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
  </footer>
</main>

<script>
"use strict";

const API = "https://api.tvmaze.com";
const cache = new Map(); // remembers answers while the page stays open

// ---------- Talking to the API ----------

// Fetch JSON from TVmaze with a timeout, a cache and readable error messages.
async function getJson(path) {
  if (cache.has(path)) return cache.get(path);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch(API + path, { signal: controller.signal });
    if (response.status === 429) {
      throw new Error("TVmaze says there were too many requests. Wait a few seconds and try again.");
    }
    if (!response.ok) {
      throw new Error("TVmaze returned an error (" + response.status + ").");
    }
    const data = await response.json();
    cache.set(path, data);
    return data;
  } catch (error) {
    if (error.name === "AbortError") throw new Error("TVmaze took too long to answer. Please try again.");
    if (error instanceof TypeError) throw new Error("Could not reach TVmaze. Check your internet connection.");
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- Pure helpers (no page access, easy to test) ----------

// Today's date as YYYY-MM-DD in the visitor's time zone.
function todayString() {
  return new Date().toLocaleDateString("en-CA");
}

// An episode counts as aired if it has an air date that is today or earlier.
function isAired(episode, today) {
  return Boolean(episode.airdate) && episode.airdate <= today;
}

// Turn the flat episode list into [{ season: 1, episodes: [...] }, ...].
function groupBySeason(episodes) {
  const seasons = new Map();
  for (const episode of episodes) {
    if (!seasons.has(episode.season)) seasons.set(episode.season, []);
    seasons.get(episode.season).push(episode);
  }
  return [...seasons.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([season, list]) => ({ season, episodes: list }));
}

// TVmaze summaries contain HTML tags; keep only the plain text.
function plainText(html) {
  if (!html) return "";
  return new DOMParser().parseFromString(html, "text/html").body.textContent.trim();
}

function formatEpisodeNumber(season, number) {
  if (number === null || number === undefined) return "Special";
  return "S" + String(season).padStart(2, "0") + "E" + String(number).padStart(2, "0");
}

// ---------- Building the page ----------

// Small helper to create an element. Text is inserted as text, never as HTML,
// so data from the API cannot inject code into the page.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setStatus(message, isError) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.className = isError ? "error" : "";
}

function renderResults(matches) {
  const list = document.getElementById("results");
  list.replaceChildren();
  document.getElementById("show").hidden = true;

  for (const { show } of matches) {
    const button = el("button", "result");
    button.type = "button";
    if (show.image && show.image.medium) {
      const img = el("img");
      img.src = show.image.medium;
      img.alt = "";
      img.loading = "lazy";
      button.append(img);
    } else {
      button.append(el("div", "noimg"));
    }

    const text = el("div");
    text.append(el("div", "name", show.name));
    const year = show.premiered ? show.premiered.slice(0, 4) : "year unknown";
    const parts = [year, show.status, show.network && show.network.name].filter(Boolean);
    text.append(el("div", "meta", parts.join(" · ")));
    button.append(text);

    button.addEventListener("click", () => { location.hash = "show=" + show.id; });

    const item = el("li");
    item.append(button);
    list.append(item);
  }
}

// "2022–" for a running show, "2007–2019" for an ended one, "2010" for a one-year show.
function yearRange(show) {
  if (!show.premiered) return "";
  const start = show.premiered.slice(0, 4);
  if (show.ended) {
    const end = show.ended.slice(0, 4);
    return end === start ? start : start + "–" + end;
  }
  return show.status === "Running" ? start + "–" : start;
}

// Network for TV shows, web channel (Netflix, Apple TV, ...) for streaming shows.
function channelName(show) {
  return (show.network && show.network.name) || (show.webChannel && show.webChannel.name) || "";
}

// Pick the backdrop: the main "background" image if there is one, else the first.
// TVmaze only offers backgrounds at original size, so prefer the narrowest one that is still wide enough.
function pickBackdrop(images) {
  const backgrounds = (images || []).filter((image) => image.type === "background" && image.resolutions.original);
  if (backgrounds.length === 0) return null;
  const main = backgrounds.find((image) => image.main);
  if (main) return main.resolutions.original.url;
  const wideEnough = backgrounds
    .map((image) => image.resolutions.original)
    .filter((resolution) => resolution.width >= 1280)
    .sort((a, b) => a.width - b.width);
  return (wideEnough[0] || backgrounds[0].resolutions.original).url;
}

function link(href, text) {
  const anchor = el("a", "", text);
  anchor.href = href;
  anchor.target = "_blank";
  anchor.rel = "noopener";
  return anchor;
}

// The paragraph starts clamped by CSS. Once it is on the page, offer "Read more"
// only if the text is actually cut off.
function addReadMore(paragraph) {
  requestAnimationFrame(() => {
    if (paragraph.scrollHeight <= paragraph.clientHeight + 1) {
      paragraph.classList.remove("clamped");
      return;
    }
    const more = el("button", "link-button", "Read more");
    more.type = "button";
    more.setAttribute("aria-expanded", "false");
    more.addEventListener("click", () => {
      const clamped = paragraph.classList.toggle("clamped");
      more.textContent = clamped ? "Read more" : "Show less";
      more.setAttribute("aria-expanded", String(!clamped));
    });
    paragraph.after(more);
  });
}

function renderHero(show, images) {
  const hero = el("header", "hero");
  const backdropUrl = pickBackdrop(images);
  if (backdropUrl) {
    const backdrop = el("img", "backdrop");
    backdrop.src = backdropUrl;
    backdrop.alt = "";
    hero.append(backdrop);
  }

  const inner = el("div", "hero-inner");
  if (show.image && (show.image.medium || show.image.original)) {
    const poster = el("img", "poster");
    poster.src = show.image.medium || show.image.original;
    poster.alt = "Poster of " + show.name;
    inner.append(poster);
  } else {
    inner.append(el("div", "noposter"));
  }

  const text = el("div", "hero-text");
  const title = el("h2", "", show.name + " ");
  const years = yearRange(show);
  if (years) title.append(el("span", "years", "(" + years + ")"));
  text.append(title);

  const runtime = show.runtime || show.averageRuntime;
  const facts = [
    (show.genres || []).join(", "),
    show.status,
    channelName(show),
    runtime ? runtime + " min" : ""
  ].filter(Boolean);
  text.append(el("p", "facts", facts.join(" · ")));

  if (show.rating && show.rating.average) {
    const rating = el("div", "rating");
    rating.setAttribute("aria-label", "Rated " + show.rating.average + " out of 10 on TVmaze");
    rating.append(el("span", "star", "★"), show.rating.average.toFixed(1), el("span", "scale", "/ 10"));
    text.append(rating);
  }

  const summaryText = plainText(show.summary);
  if (summaryText) {
    const summary = el("p", "summary clamped", summaryText);
    text.append(summary);
    addReadMore(summary);
  }

  const links = el("div", "links");
  if (show.url) links.append(link(show.url, "TVmaze page"));
  if (show.externals && show.externals.imdb) links.append(link("https://www.imdb.com/title/" + show.externals.imdb + "/", "IMDb"));
  if (show.officialSite) links.append(link(show.officialSite, "Official site"));
  text.append(links);

  inner.append(text);
  hero.append(inner);
  return hero;
}

function formatDate(isoDate) {
  if (!isoDate) return "";
  return new Date(isoDate + "T12:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function renderInfo(show, seasons, airedCount) {
  const rows = [
    ["Premiered", formatDate(show.premiered)],
    [show.ended ? "Ended" : "Status", show.ended ? formatDate(show.ended) : show.status],
    ["Schedule", [(show.schedule.days || []).join(", "), show.schedule.time].filter(Boolean).join(" at ")],
    ["Seasons", seasons.length ? String(seasons.length) : ""],
    ["Episodes aired", String(airedCount)],
    ["Type", show.type],
    ["Language", show.language]
  ];
  const list = el("dl", "info");
  for (const [label, value] of rows) {
    if (!value) continue;
    const item = el("div");
    item.append(el("dt", "", label), el("dd", "", value));
    list.append(item);
  }
  return list;
}

function renderShow(show, images, requestedSeason) {
  const embedded = show._embedded || {};
  const episodes = embedded.episodes || [];
  const seasons = embedded.seasons || [];
  const today = todayString();
  const aired = episodes.filter((episode) => isAired(episode, today));
  const container = document.getElementById("show");
  container.replaceChildren();
  document.title = show.name + " – Episode Finder";

  container.append(renderHero(show, images), renderInfo(show, seasons, aired.length));

  const allSeasons = buildSeasons(seasons, aired);
  if (allSeasons.length === 0) {
    container.append(el("p", "", "No aired episodes are listed for this series yet."));
    container.hidden = false;
    return;
  }

  const head = el("div", "show-head");
  head.append(el("h2", "", "Seasons"));
  if (allSeasons.length > 1) head.append(el("span", "hint", "Tip: ← and → switch seasons"));
  const strip = el("ul", "season-strip");
  const panel = el("section", "season-panel");
  panel.setAttribute("aria-live", "polite");
  container.append(head, strip, panel);

  const cards = allSeasons.map((season, index) => {
    const card = renderSeasonCard(show, season, today);
    card.addEventListener("click", () => selectSeason(index));
    const item = el("li");
    item.append(card);
    strip.append(item);
    return card;
  });

  function selectSeason(index, scroll = true) {
    if (index < 0 || index >= allSeasons.length) return;
    cards.forEach((card, i) => card.setAttribute("aria-pressed", String(i === index)));
    if (scroll) cards[index].scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    panel.replaceChildren(...renderSeasonPanel(show, allSeasons, index, today, selectSeason));
    history.replaceState(null, "", "#show=" + show.id + "&season=" + allSeasons[index].number);
  }
  seasonKeys = (delta) => {
    const current = cards.findIndex((card) => card.getAttribute("aria-pressed") === "true");
    selectSeason(current + delta);
  };

  // Start with the season from the address, else the latest season that has aired episodes.
  let start = allSeasons.findIndex((season) => season.number === requestedSeason);
  if (start === -1) {
    start = allSeasons.length - 1;
    while (start > 0 && allSeasons[start].episodes.length === 0) start -= 1;
  }
  container.hidden = false;
  selectSeason(start, false);
  requestAnimationFrame(() => {
    strip.scrollLeft += cards[start].getBoundingClientRect().left - strip.getBoundingClientRect().left - 8;
  });
}

// Merge TVmaze's season list with the aired episodes: [{ number, info, episodes }, ...].
// A season can exist without aired episodes (announced) or episodes without a season entry.
function buildSeasons(seasonList, airedEpisodes) {
  const info = new Map(seasonList.map((season) => [season.number, season]));
  const groups = new Map(groupBySeason(airedEpisodes).map((group) => [group.season, group.episodes]));
  const numbers = new Set([...info.keys(), ...groups.keys()]);
  return [...numbers]
    .sort((a, b) => a - b)
    .map((number) => ({ number, info: info.get(number) || null, episodes: groups.get(number) || [] }));
}

// "2022 · 9 episodes", "2025 · 3 of 10 aired", "Premieres 12 Jan 2027"
function seasonMeta(season, today) {
  const info = season.info || {};
  const aired = season.episodes.length;
  if (aired === 0) {
    return info.premiereDate && info.premiereDate > today ? "Premieres " + formatDate(info.premiereDate) : "Not aired yet";
  }
  const start = info.premiereDate || season.episodes[0].airdate;
  const planned = info.episodeOrder;
  const count = planned && planned > aired ? aired + " of " + planned + " aired" : aired + (aired === 1 ? " episode" : " episodes");
  return [start ? start.slice(0, 4) : "", count].filter(Boolean).join(" · ");
}

function seasonTitle(season) {
  const name = season.info && season.info.name;
  const base = "Season " + season.number;
  return name && name !== base ? base + ": " + name : base;
}

function renderSeasonCard(show, season, today) {
  const card = el("button", "season-card");
  card.type = "button";
  if (season.episodes.length === 0) card.classList.add("upcoming");

  // Season poster if TVmaze has one; otherwise the show poster, dimmed, with the season number on top.
  const own = season.info && season.info.image && season.info.image.medium;
  const fallback = show.image && show.image.medium;
  const thumb = el("div", own ? "thumb" : "thumb fallback");
  if (own || fallback) {
    const img = el("img");
    img.src = own || fallback;
    img.alt = "";
    img.loading = "lazy";
    thumb.append(img);
  }
  if (!own) thumb.append(el("span", "label", "S" + season.number));
  card.append(thumb, el("div", "name", seasonTitle(season)), el("div", "meta", seasonMeta(season, today)));
  return card;
}

function renderSeasonPanel(show, allSeasons, index, today, selectSeason) {
  const season = allSeasons[index];
  const nav = el("div", "season-nav");
  const makeStep = (target, label) => {
    const button = el("button", "step", label);
    button.type = "button";
    if (target < 0 || target >= allSeasons.length) {
      button.disabled = true;
      button.classList.add("placeholder");
    } else {
      button.addEventListener("click", () => selectSeason(target));
    }
    return button;
  };
  const heading = el("div", "season-title");
  heading.append(el("h3", "", seasonTitle(season)), el("span", "meta", seasonMeta(season, today)));
  nav.append(
    makeStep(index - 1, "‹ Previous"),
    heading,
    makeStep(index + 1, "Next ›")
  );

  const parts = [nav];
  const summaryText = season.info && plainText(season.info.summary);
  if (summaryText) parts.push(el("p", "season-summary", summaryText));

  if (season.episodes.length === 0) {
    parts.push(el("p", "empty", "No episodes of this season have aired yet."));
    return parts;
  }
  const finaleId = finaleEpisodeId(show, season, index === allSeasons.length - 1, today);
  const toolbar = el("div", "ep-toolbar");
  const sortButton = el("button", "step");
  sortButton.type = "button";
  toolbar.append(sortButton);
  const list = el("ol", "episodes");

  const finaleLabel = show.ended && index === allSeasons.length - 1 ? "Series finale" : "Season finale";
  const fillList = () => {
    const ordered = newestFirst ? [...season.episodes].reverse() : season.episodes;
    sortButton.textContent = newestFirst ? "↓ Newest first" : "↑ Oldest first";
    sortButton.setAttribute("aria-label", "Sort order: " + (newestFirst ? "newest first" : "oldest first") + ". Click to change.");
    list.replaceChildren(...ordered.map((episode) => renderEpisode(episode, episode.id === finaleId ? finaleLabel : "")));
  };
  sortButton.addEventListener("click", () => {
    newestFirst = !newestFirst;
    saveSetting("newestFirst", newestFirst);
    fillList();
  });
  fillList();
  parts.push(toolbar, list);
  return parts;
}

// The last episode of a season counts as its finale once the season is complete:
// all ordered episodes have aired, its end date has passed, or a later season exists.
function finaleEpisodeId(show, season, isLastSeason, today) {
  const last = season.episodes[season.episodes.length - 1];
  if (!last || last.number === null) return null;
  const info = season.info || {};
  const complete = (info.episodeOrder && season.episodes.length >= info.episodeOrder)
    || (info.endDate && info.endDate <= today)
    || !isLastSeason
    || Boolean(show.ended);
  return complete ? last.id : null;
}

function renderEpisode(episode, label) {
  const item = el("li", "episode");

  // Landscape still from TVmaze, or a neutral tile with the episode number.
  const still = el("div", "still");
  if (episode.image && episode.image.medium) {
    const img = el("img");
    img.src = episode.image.medium;
    img.alt = "";
    img.loading = "lazy";
    still.append(img);
  } else {
    still.append(el("span", "", episode.number === null ? "Special" : "E" + episode.number));
  }

  const body = el("div", "ep-body");
  const top = el("div", "ep-top");
  top.append(el("span", "ep-num", formatEpisodeNumber(episode.season, episode.number)), el("span", "ep-name", episode.name));
  if (label) top.append(el("span", "badge", label));
  body.append(top);

  const meta = el("div", "ep-meta");
  const metaParts = [formatDate(episode.airdate), episode.runtime ? episode.runtime + " min" : ""].filter(Boolean);
  meta.append(metaParts.join(" · "));
  if (episode.rating && episode.rating.average) {
    meta.append(" · ");
    const rating = el("span", "ep-rating");
    rating.setAttribute("aria-label", "Rated " + episode.rating.average + " out of 10");
    rating.append(el("span", "star", "★"), " " + episode.rating.average.toFixed(1));
    meta.append(rating);
  }
  body.append(meta);

  const summaryText = plainText(episode.summary);
  if (summaryText) {
    const summary = el("p", "ep-summary clamped", summaryText);
    body.append(summary);
    addReadMore(summary);
  }

  item.append(still, body);
  return item;
}

// Small per-browser preferences. Storage can be unavailable (private mode), so never rely on it.
function loadSetting(key, fallback) {
  try {
    const value = localStorage.getItem("episode-finder:" + key);
    return value === null ? fallback : JSON.parse(value);
  } catch (error) {
    return fallback;
  }
}
function saveSetting(key, value) {
  try { localStorage.setItem("episode-finder:" + key, JSON.stringify(value)); } catch (error) { /* ignore */ }
}

let newestFirst = loadSetting("newestFirst", false);

// Set while a show is displayed: moves the season selection by -1 or +1.
let seasonKeys = null;
document.addEventListener("keydown", (event) => {
  if (!seasonKeys || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  if (event.target.closest("input, textarea, select, [contenteditable]")) return;
  if (document.getElementById("show").hidden) return;
  if (event.key === "ArrowLeft") { event.preventDefault(); seasonKeys(-1); }
  if (event.key === "ArrowRight") { event.preventDefault(); seasonKeys(1); }
});

// ---------- What happens when the visitor acts ----------

async function runSearch(query) {
  setStatus("Searching…");
  document.getElementById("show").hidden = true;
  document.title = "Episode Finder";
  try {
    const matches = await getJson("/search/shows?q=" + encodeURIComponent(query));
    renderResults(matches.slice(0, 8));
    setStatus(matches.length ? "Pick the series you meant:" : "No series found for “" + query + "”.");
  } catch (error) {
    document.getElementById("results").replaceChildren();
    setStatus(error.message, true);
  }
}

async function loadShow(id, season) {
  setStatus("Loading episodes…");
  document.getElementById("results").replaceChildren();
  try {
    // One request returns the show with its seasons, episodes, cast and next episode.
    // Images are a separate request and only decorate the header, so a failure there is ignored.
    const [show, images] = await Promise.all([
      getJson("/shows/" + id + "?embed[]=seasons&embed[]=episodes&embed[]=cast&embed[]=nextepisode&embed[]=previousepisode"),
      getJson("/shows/" + id + "/images").catch(() => [])
    ]);
    renderShow(show, images, season);
    setStatus("");
  } catch (error) {
    setStatus(error.message, true);
  }
}

// The address (#show=66&season=2) lets people bookmark or share a series and season.
function loadFromHash() {
  const match = location.hash.match(/^#show=(\d+)(?:&season=(\d+))?$/);
  if (match) loadShow(match[1], match[2] === undefined ? null : Number(match[2]));
}

document.getElementById("search-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const query = document.getElementById("query").value.trim();
  if (query) {
    if (location.hash) history.replaceState(null, "", location.pathname);
    runSearch(query);
  }
});
window.addEventListener("hashchange", loadFromHash);
loadFromHash();
</script>
