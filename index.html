<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode Finder</title>
  <style>
    :root { color-scheme: light dark; --accent: #2b6cb0; --muted: #6b7280; --line: rgba(128, 128, 128, 0.3); --surface: rgba(128, 128, 128, 0.08); --star: #f5b301; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    img { max-width: 100%; }

    /* Series header: backdrop, poster, title, facts, rating, summary */
    .hero { position: relative; overflow: hidden; margin: 8px 0 20px; border-radius: 12px; background: #1f2937; color: #f9fafb; }
    .hero .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.85) 45%, rgba(15, 23, 42, 0.55) 100%); }
    .hero-inner { position: relative; z-index: 1; display: flex; gap: 24px; padding: 24px; }
    .hero .poster, .hero .noposter { flex: none; width: 180px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; background: rgba(255, 255, 255, 0.1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .hero-text { min-width: 0; flex: 1; }
    .hero h2 { margin: 0; font-size: 1.9rem; line-height: 1.2; }
    .hero h2 .years { font-weight: 400; color: #cbd5e1; }
    .hero .facts { margin: 6px 0 12px; color: #cbd5e1; font-size: 0.95rem; }
    .rating { display: inline-flex; align-items: baseline; gap: 4px; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); font-weight: 600; }
    .rating .star { color: var(--star); }
    .rating .scale { font-weight: 400; color: #cbd5e1; font-size: 0.85rem; }
    .summary { margin: 0; }
    .summary.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .link-button { padding: 0; border: 0; background: none; color: #93c5fd; font: inherit; text-decoration: underline; }
    .hero .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 0.9rem; }
    .hero .links a { color: #93c5fd; }
    .info { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 24px; margin: 0 0 24px; padding: 16px; border-radius: 12px; background: var(--surface); }
    .info dt { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .info dd { margin: 0; }
    @media (max-width: 600px) {
      .hero-inner { flex-direction: column; padding: 16px; gap: 16px; }
      .hero .poster, .hero .noposter { width: 120px; }
      .hero h2 { font-size: 1.5rem; }
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .lead { margin: 0 0 20px; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input[type="search"] { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
    button { font: inherit; cursor: pointer; }
    form button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
    #status { min-height: 1.5em; margin: 16px 0; color: var(--muted); }
    #status.error { color: #c53030; }
    .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .result { display: flex; gap: 12px; width: 100%; padding: 8px; text-align: left; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; }
    .result:hover, .result:focus-visible { border-color: var(--accent); }
    .result img, .result .noimg { width: 48px; height: 68px; flex: none; object-fit: cover; border-radius: 4px; background: var(--line); }
    .result .name { font-weight: 600; }
    .result .meta { color: var(--muted); font-size: 0.9rem; }
    .show-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .show-head h2 { margin: 0; font-size: 1.3rem; }
    .toggles button { padding: 4px 10px; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; }
    details { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
    summary { padding: 10px 12px; cursor: pointer; font-weight: 600; }
    summary .count { font-weight: 400; color: var(--muted); }
    ol.episodes { list-style: none; margin: 0; padding: 0 12px 8px; }
    ol.episodes li { padding: 8px 0; border-top: 1px solid var(--line); }
    .ep-title { display: flex; gap: 12px; }
    .ep-num { flex: none; width: 3.2em; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ep-name { flex: 1; font-weight: 500; }
    .ep-date { flex: none; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .ep-summary { margin: 2px 0 0 calc(3.2em + 12px); color: var(--muted); font-size: 0.9rem; }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
    footer a, .lead a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Episode Finder</h1>
  <p class="lead">Search any TV series and see every episode that has aired.</p>

  <form id="search-form">
    <input id="query" type="search" placeholder="e.g. The Big Bang Theory" aria-label="TV series name" autocomplete="off" required>
    <button type="submit">Search</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <ul id="results" class="results"></ul>
  <section id="show" hidden></section>

  <footer>
    Data from <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVmaze.com</a>,
    licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
  </footer>
</main>

<script>
"use strict";

const API = "https://api.tvmaze.com";
const cache = new Map(); // remembers answers while the page stays open

// ---------- Talking to the API ----------

// Fetch JSON from TVmaze with a timeout, a cache and readable error messages.
async function getJson(path) {
  if (cache.has(path)) return cache.get(path);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch(API + path, { signal: controller.signal });
    if (response.status === 429) {
      throw new Error("TVmaze says there were too many requests. Wait a few seconds and try again.");
    }
    if (!response.ok) {
      throw new Error("TVmaze returned an error (" + response.status + ").");
    }
    const data = await response.json();
    cache.set(path, data);
    return data;
  } catch (error) {
    if (error.name === "AbortError") throw new Error("TVmaze took too long to answer. Please try again.");
    if (error instanceof TypeError) throw new Error("Could not reach TVmaze. Check your internet connection.");
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- Pure helpers (no page access, easy to test) ----------

// Today's date as YYYY-MM-DD in the visitor's time zone.
function todayString() {
  return new Date().toLocaleDateString("en-CA");
}

// An episode counts as aired if it has an air date that is today or earlier.
function isAired(episode, today) {
  return Boolean(episode.airdate) && episode.airdate <= today;
}

// Turn the flat episode list into [{ season: 1, episodes: [...] }, ...].
function groupBySeason(episodes) {
  const seasons = new Map();
  for (const episode of episodes) {
    if (!seasons.has(episode.season)) seasons.set(episode.season, []);
    seasons.get(episode.season).push(episode);
  }
  return [...seasons.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([season, list]) => ({ season, episodes: list }));
}

// TVmaze summaries contain HTML tags; keep only the plain text.
function plainText(html) {
  if (!html) return "";
  return new DOMParser().parseFromString(html, "text/html").body.textContent.trim();
}

function formatEpisodeNumber(season, number) {
  if (number === null || number === undefined) return "Special";
  return "S" + String(season).padStart(2, "0") + "E" + String(number).padStart(2, "0");
}

// ---------- Building the page ----------

// Small helper to create an element. Text is inserted as text, never as HTML,
// so data from the API cannot inject code into the page.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setStatus(message, isError) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.className = isError ? "error" : "";
}

function renderResults(matches) {
  const list = document.getElementById("results");
  list.replaceChildren();
  document.getElementById("show").hidden = true;

  for (const { show } of matches) {
    const button = el("button", "result");
    button.type = "button";
    if (show.image && show.image.medium) {
      const img = el("img");
      img.src = show.image.medium;
      img.alt = "";
      img.loading = "lazy";
      button.append(img);
    } else {
      button.append(el("div", "noimg"));
    }

    const text = el("div");
    text.append(el("div", "name", show.name));
    const year = show.premiered ? show.premiered.slice(0, 4) : "year unknown";
    const parts = [year, show.status, show.network && show.network.name].filter(Boolean);
    text.append(el("div", "meta", parts.join(" · ")));
    button.append(text);

    button.addEventListener("click", () => { location.hash = "show=" + show.id; });

    const item = el("li");
    item.append(button);
    list.append(item);
  }
}

// "2022–" for a running show, "2007–2019" for an ended one, "2010" for a one-year show.
function yearRange(show) {
  if (!show.premiered) return "";
  const start = show.premiered.slice(0, 4);
  if (show.ended) {
    const end = show.ended.slice(0, 4);
    return end === start ? start : start + "–" + end;
  }
  return show.status === "Running" ? start + "–" : start;
}

// Network for TV shows, web channel (Netflix, Apple TV, ...) for streaming shows.
function channelName(show) {
  return (show.network && show.network.name) || (show.webChannel && show.webChannel.name) || "";
}

// Pick the backdrop: the main "background" image if there is one, else the first.
// TVmaze only offers backgrounds at original size, so prefer the narrowest one that is still wide enough.
function pickBackdrop(images) {
  const backgrounds = (images || []).filter((image) => image.type === "background" && image.resolutions.original);
  if (backgrounds.length === 0) return null;
  const main = backgrounds.find((image) => image.main);
  if (main) return main.resolutions.original.url;
  const wideEnough = backgrounds
    .map((image) => image.resolutions.original)
    .filter((resolution) => resolution.width >= 1280)
    .sort((a, b) => a.width - b.width);
  return (wideEnough[0] || backgrounds[0].resolutions.original).url;
}

function link(href, text) {
  const anchor = el("a", "", text);
  anchor.href = href;
  anchor.target = "_blank";
  anchor.rel = "noopener";
  return anchor;
}

function renderHero(show, images) {
  const hero = el("header", "hero");
  const backdropUrl = pickBackdrop(images);
  if (backdropUrl) {
    const backdrop = el("img", "backdrop");
    backdrop.src = backdropUrl;
    backdrop.alt = "";
    hero.append(backdrop);
  }

  const inner = el("div", "hero-inner");
  if (show.image && (show.image.medium || show.image.original)) {
    const poster = el("img", "poster");
    poster.src = show.image.medium || show.image.original;
    poster.alt = "Poster of " + show.name;
    inner.append(poster);
  } else {
    inner.append(el("div", "noposter"));
  }

  const text = el("div", "hero-text");
  const title = el("h2", "", show.name + " ");
  const years = yearRange(show);
  if (years) title.append(el("span", "years", "(" + years + ")"));
  text.append(title);

  const runtime = show.runtime || show.averageRuntime;
  const facts = [
    (show.genres || []).join(", "),
    show.status,
    channelName(show),
    runtime ? runtime + " min" : ""
  ].filter(Boolean);
  text.append(el("p", "facts", facts.join(" · ")));

  if (show.rating && show.rating.average) {
    const rating = el("div", "rating");
    rating.setAttribute("aria-label", "Rated " + show.rating.average + " out of 10 on TVmaze");
    rating.append(el("span", "star", "★"), show.rating.average.toFixed(1), el("span", "scale", "/ 10"));
    text.append(rating);
  }

  const summaryText = plainText(show.summary);
  if (summaryText) {
    const summary = el("p", "summary clamped", summaryText);
    text.append(summary);
    // Only offer "Read more" when the text is actually cut off (measured once the page shows it).
    requestAnimationFrame(() => {
      if (summary.scrollHeight <= summary.clientHeight + 1) {
        summary.classList.remove("clamped");
        return;
      }
      const more = el("button", "link-button", "Read more");
      more.type = "button";
      more.addEventListener("click", () => {
        const clamped = summary.classList.toggle("clamped");
        more.textContent = clamped ? "Read more" : "Show less";
      });
      summary.after(more);
    });
  }

  const links = el("div", "links");
  if (show.url) links.append(link(show.url, "TVmaze page"));
  if (show.externals && show.externals.imdb) links.append(link("https://www.imdb.com/title/" + show.externals.imdb + "/", "IMDb"));
  if (show.officialSite) links.append(link(show.officialSite, "Official site"));
  text.append(links);

  inner.append(text);
  hero.append(inner);
  return hero;
}

function formatDate(isoDate) {
  if (!isoDate) return "";
  return new Date(isoDate + "T12:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function renderInfo(show, seasons, airedCount) {
  const rows = [
    ["Premiered", formatDate(show.premiered)],
    [show.ended ? "Ended" : "Status", show.ended ? formatDate(show.ended) : show.status],
    ["Schedule", [(show.schedule.days || []).join(", "), show.schedule.time].filter(Boolean).join(" at ")],
    ["Seasons", seasons.length ? String(seasons.length) : ""],
    ["Episodes aired", String(airedCount)],
    ["Type", show.type],
    ["Language", show.language]
  ];
  const list = el("dl", "info");
  for (const [label, value] of rows) {
    if (!value) continue;
    const item = el("div");
    item.append(el("dt", "", label), el("dd", "", value));
    list.append(item);
  }
  return list;
}

function renderShow(show, images) {
  const embedded = show._embedded || {};
  const episodes = embedded.episodes || [];
  const seasons = embedded.seasons || [];
  const today = todayString();
  const aired = episodes.filter((episode) => isAired(episode, today));
  const container = document.getElementById("show");
  container.replaceChildren();
  document.title = show.name + " – Episode Finder";

  container.append(renderHero(show, images), renderInfo(show, seasons, aired.length));

  const head = el("div", "show-head");
  head.append(el("h2", "", "Episodes"));
  const toggles = el("div", "toggles");
  const expand = el("button", "", "Expand all");
  const collapse = el("button", "", "Collapse all");
  expand.type = collapse.type = "button";
  const setAll = (open) => container.querySelectorAll("details").forEach((d) => { d.open = open; });
  expand.addEventListener("click", () => setAll(true));
  collapse.addEventListener("click", () => setAll(false));
  toggles.append(expand, " ", collapse);
  head.append(toggles);
  container.append(head);

  if (aired.length === 0) {
    container.append(el("p", "", "No aired episodes are listed for this series yet."));
  }

  groupBySeason(aired).forEach((group, index) => {
    const details = el("details");
    details.open = index === 0;
    const summary = el("summary", "", "Season " + group.season + " ");
    summary.append(el("span", "count", "(" + group.episodes.length + " episodes)"));
    details.append(summary);

    const list = el("ol", "episodes");
    for (const episode of group.episodes) {
      const item = el("li");
      const title = el("div", "ep-title");
      title.append(
        el("span", "ep-num", formatEpisodeNumber(episode.season, episode.number)),
        el("span", "ep-name", episode.name),
        el("span", "ep-date", episode.airdate)
      );
      item.append(title);
      const summaryText = plainText(episode.summary);
      if (summaryText) item.append(el("p", "ep-summary", summaryText));
      list.append(item);
    }
    details.append(list);
    container.append(details);
  });

  container.hidden = false;
}

// ---------- What happens when the visitor acts ----------

async function runSearch(query) {
  setStatus("Searching…");
  document.getElementById("show").hidden = true;
  document.title = "Episode Finder";
  try {
    const matches = await getJson("/search/shows?q=" + encodeURIComponent(query));
    renderResults(matches.slice(0, 8));
    setStatus(matches.length ? "Pick the series you meant:" : "No series found for “" + query + "”.");
  } catch (error) {
    document.getElementById("results").replaceChildren();
    setStatus(error.message, true);
  }
}

async function loadShow(id) {
  setStatus("Loading episodes…");
  document.getElementById("results").replaceChildren();
  try {
    // One request returns the show with its seasons, episodes, cast and next episode.
    // Images are a separate request and only decorate the header, so a failure there is ignored.
    const [show, images] = await Promise.all([
      getJson("/shows/" + id + "?embed[]=seasons&embed[]=episodes&embed[]=cast&embed[]=nextepisode&embed[]=previousepisode"),
      getJson("/shows/" + id + "/images").catch(() => [])
    ]);
    renderShow(show, images);
    setStatus("");
  } catch (error) {
    setStatus(error.message, true);
  }
}

// The address (#show=66) lets people bookmark or share a series.
function loadFromHash() {
  const match = location.hash.match(/^#show=(\d+)$/);
  if (match) loadShow(match[1]);
}

document.getElementById("search-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const query = document.getElementById("query").value.trim();
  if (query) {
    if (location.hash) history.replaceState(null, "", location.pathname);
    runSearch(query);
  }
});
window.addEventListener("hashchange", loadFromHash);
loadFromHash();
</script>
</body>
</html>
